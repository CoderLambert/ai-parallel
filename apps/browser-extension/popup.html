<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Parallel Launcher</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <div class="eyebrow">AI PARALLEL LAUNCHER</div>
        <h1>一次提问，多模型并行</h1>
      </div>
      <button id="clearBtn" class="icon-button" type="button" title="清空输入">清空</button>
    </header>

    <section class="provider-panel" aria-label="模型选择">
      <div class="section-head">
        <span>模型</span>
        <button id="toggleAllBtn" class="text-button" type="button">全选</button>
      </div>
      <div id="providerGrid" class="provider-grid"></div>
    </section>

    <section class="composer">
      <textarea id="promptInput" rows="8" autofocus placeholder="输入你想同时发送给多个模型的 Prompt…"></textarea>
      <div class="composer-meta">
        <span id="charCount">0 字符</span>
        <span>Ctrl / ⌘ + Enter 发送</span>
      </div>
    </section>

    <div id="errorBox" class="error-box" hidden></div>

    <button id="sendBtn" class="send-button" type="button">
      <span>并行发送</span>
      <span id="selectedCount" class="count-pill">0</span>
    </button>

    <section class="status-panel">
      <div class="section-head"><span>启动方式</span></div>
      <div class="status-list empty">点击发送后打开 Workspace，并自动发送到已选模型。</div>
    </section>

    <footer>
      Prompt 仅保存在浏览器扩展本地存储中，不写入 URL。
    </footer>
  </main>
  <script src="shared/provider-catalog.js"></script>
  <script src="shared/contract-runtime.js"></script>
  <script src="shared/storage-contract.js"></script>
  <script src="popup.js"></script>
</body>
</html>
