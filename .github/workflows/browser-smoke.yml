name: Browser Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install project
        run: pnpm install --frozen-lockfile

      - name: Build Chrome artifact
        run: pnpm build:chrome

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check workspace smoke syntax
        run: node --check tests/browser-smoke.cjs

      - name: Check extension pages smoke syntax
        run: node --check tests/extension-pages-smoke.cjs

      - name: Run extension smoke
        env:
          AI_PARALLEL_EXTENSION_ROOT: dist/chrome-mv3
          AI_PARALLEL_BROWSER_HEADLESS: "true"
        run: pnpm e2e:browser

      - name: Upload browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          path: |
            test-results/browser-smoke
            test-results/extension-pages-smoke
          if-no-files-found: ignore
